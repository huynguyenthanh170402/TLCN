spring.application.name=TieuLuanChuyenNganhFITHCMUTE

# Nap them file khai bao thu, neu file ton tai.
# File mail-local.properties nam o thu muc goc du an va da duoc .gitignore
# bo qua, nen mat khau ung dung khong di theo ma nguon len GitHub.
spring.config.import=optional:file:./mail-local.properties
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# ========== SQL Server ==========
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLyTruongHocTLCN;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ========== JPA / Hibernate ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ========== Application Port ==========
server.port=8082

# ========== Thymeleaf ==========
spring.thymeleaf.cache=false

# ========== Internationalization ==========
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ========== Logging ==========
logging.level.root=INFO
logging.level.vn.TieuLuanChuyenNganhFITHCMUTE=DEBUG
#logging.level.org.springframework.security=DEBUG
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ========== Gui thu (quen mat khau) ==========
# Mat khau ung dung cua Gmail KHONG duoc ghi thang vao file nay.
# Dat bien moi truong MAIL_USER va MAIL_PASS roi khoi dong lai, vi du trong
# Eclipse: Run Configurations -> Environment -> New.
# Chua dat thi ung dung van chay, noi dung thu se in ra Console.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USER:no-reply@hcmute.edu.vn}}
