spring.application.name=TieuLuanChuyenNganhFITHCMUTE
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# ========== SQL Server ==========
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLyTruongHocTLCN;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ========== JPA / Hibernate ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ========== Application Port ==========
server.port=8082

# ========== Thymeleaf ==========
spring.thymeleaf.cache=false

# ========== Internationalization ==========
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ========== Logging ==========
logging.level.root=INFO
logging.level.vn.TieuLuanChuyenNganhFITHCMUTE=DEBUG
#logging.level.org.springframework.security=DEBUG