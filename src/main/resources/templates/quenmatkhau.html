<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="#{quenmk.title}">Quên mật khẩu</title>

    <style>
        .auth-wrap {
            min-height: calc(100vh - 70px);
            display: flex; align-items: center; justify-content: center;
            padding: 3rem 1rem;
            background:
                linear-gradient(rgba(12, 22, 42, 0.72), rgba(12, 22, 42, 0.82)),
                url('/images/campus.jpg') center/cover no-repeat fixed;
        }
        .auth-card {
            width: 100%; max-width: 460px;
            border: none; border-radius: 18px; overflow: hidden;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        }
        .auth-head {
            background: linear-gradient(135deg, #0b3d91 0%, #1565c0 100%);
            color: #fff; padding: 2rem 2rem 1.5rem; text-align: center;
        }
        .auth-head .auth-logo {
            width: 62px; height: 62px; margin: 0 auto 0.9rem; border-radius: 50%;
            background: rgba(255,255,255,.16);
            display: flex; align-items: center; justify-content: center; font-size: 1.7rem;
        }
        .auth-head h4 { margin: 0; font-weight: 700; }
        .auth-body { padding: 1.75rem 2rem 2rem; background: #fff; }
        .auth-body .input-group-text {
            background: #f1f3f7; border-right: 0; color: #5a6b85;
            width: 44px; justify-content: center;
        }
        .auth-body .form-control { border-left: 0; padding-top: .65rem; padding-bottom: .65rem; }
        .auth-body .form-control:focus { box-shadow: none; border-color: #1565c0; }
        .auth-body .input-group:focus-within .input-group-text { border-color: #1565c0; color: #1565c0; }
        .btn-auth {
            padding: .7rem; font-weight: 600; border-radius: 10px;
            background: linear-gradient(135deg, #0b3d91 0%, #1565c0 100%);
            border: none; color: #fff;
        }
        .btn-auth:hover { filter: brightness(1.08); color: #fff; }
        .auth-foot {
            background: #f8f9fb; padding: .9rem 2rem; text-align: center;
            font-size: .875rem; border-top: 1px solid #e9ecef;
        }
        @media (max-width: 576px) {
            .auth-head, .auth-body { padding-left: 1.25rem; padding-right: 1.25rem; }
        }
    </style>
</head>
<body>
<main layout:fragment="content">

    <div class="auth-wrap">
        <div class="card auth-card">

            <div class="auth-head">
                <div class="auth-logo"><i class="fas fa-key"></i></div>
                <h4 th:text="#{quenmk.heading}">Quên mật khẩu</h4>
            </div>

            <div class="auth-body">

                <div th:if="${thongBao}" class="alert alert-success py-2 small">
                    <i class="fas fa-paper-plane me-1"></i>
                    <span th:text="${thongBao}"></span>
                </div>
                <div th:if="${loi}" class="alert alert-danger py-2 small">
                    <i class="fas fa-circle-exclamation me-1"></i>
                    <span th:text="${loi}"></span>
                </div>

                <p class="text-muted small mb-4" th:text="#{quenmk.desc}">
                    Nhập địa chỉ email gắn với tài khoản của bạn. Hệ thống sẽ gửi
                    một đường dẫn để đặt lại mật khẩu.
                </p>

                <form th:action="@{/quenmatkhau}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold" th:text="#{quenmk.email}">Địa chỉ email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" name="email" class="form-control"
                                   placeholder="22110001@student.hcmute.edu.vn"
                                   autocomplete="email" autofocus required>
                        </div>
                        <div class="form-text" th:text="#{quenmk.email_hint}">
                            Dùng email trường hoặc email cá nhân đã khai trong hồ sơ.
                        </div>
                    </div>

                    <button type="submit" class="btn btn-auth w-100">
                        <i class="fas fa-paper-plane me-2"></i>
                        <span th:text="#{quenmk.button}">Gửi liên kết đặt lại</span>
                    </button>
                </form>
            </div>

            <div class="auth-foot">
                <a th:href="@{/login}" class="text-decoration-none">
                    <i class="fas fa-arrow-left me-1"></i>
                    <span th:text="#{quenmk.back_login}">Quay lại đăng nhập</span>
                </a>
            </div>

        </div>
    </div>

</main>
</body>
</html>
