<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{sinhvien/layout}">
<head>
    <title>Thông báo</title>
    <style>
        .tb-muc { border-left: 4px solid transparent; }
        .tb-muc.chua-doc { border-left-color: #0b3d91; background: #f5f9ff; }
        .tb-muc.chua-doc .tb-tieude { font-weight: 700; }
    </style>
</head>
<body>

<h5 layout:fragment="page-title">Thông báo</h5>

<div layout:fragment="content">

    <div th:if="${loi}" class="alert alert-danger" th:text="${loi}"></div>

    <div th:if="${sinhVien == null}" class="alert alert-warning">
        Tài khoản này chưa được gắn với hồ sơ sinh viên nào.
    </div>

    <div class="card shadow-sm" th:if="${sinhVien != null}">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-bold">Thông báo dành cho bạn</span>
            <span class="small text-muted"
                  th:text="${soThongBaoChuaDoc} + ' chưa đọc / ' + ${trang.totalElements} + ' thông báo'"></span>
        </div>

        <div class="list-group list-group-flush">
            <div th:if="${trang.empty}" class="list-group-item text-center text-muted py-4">
                Chưa có thông báo nào.
            </div>

            <a th:each="tb : ${trang.content}"
               th:href="@{/sinhvien/thongbao/{id}(id=${tb.maThongBao})}"
               class="list-group-item list-group-item-action tb-muc"
               th:classappend="${!maDaDoc.contains(tb.maThongBao)} ? 'chua-doc'">
                <div class="d-flex justify-content-between align-items-start gap-2">
                    <div>
                        <span class="badge me-1" th:classappend="${tb.mauLoai}" th:text="${tb.tenLoai}"></span>
                        <span class="tb-tieude" th:text="${tb.tieuDe}"></span>
                        <div class="small text-muted mt-1">
                            <i class="fas fa-building"></i>
                            <span th:text="${tb.noiPhatHanh}"></span>
                        </div>
                    </div>
                    <small class="text-muted text-nowrap"
                           th:text="${#temporals.format(tb.ngayDang, 'dd/MM/yyyy HH:mm')}"></small>
                </div>
            </a>
        </div>

        <!-- Phân trang -->
        <div class="card-footer d-flex justify-content-end" th:if="${trang.totalPages > 1}">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${trang.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/sinhvien/thongbao(page=${trang.number - 1})}">&laquo;</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, trang.totalPages - 1)}"
                    th:classappend="${i == trang.number} ? 'active'">
                    <a class="page-link" th:href="@{/sinhvien/thongbao(page=${i})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${trang.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/sinhvien/thongbao(page=${trang.number + 1})}">&raquo;</a>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
