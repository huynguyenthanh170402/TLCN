<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title layout:title-pattern="$CONTENT_TITLE | Cổng sinh viên">Cổng sinh viên</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/bang.css}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        :root { --sv-sidebar-width: 250px; }

        body {
            background: #f4f6f9;
            overflow-x: hidden;
        }

        img, svg, video, iframe { max-width: 100%; height: auto; }

        td, th, p, li, h1, h2, h3, h4, h5, h6 {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .table-responsive { -webkit-overflow-scrolling: touch; }

        /* ============================================================
           BỐ CỤC: dùng flex thay cho fixed + margin-left.
           Cách cũ ghi cứng margin-left 250px, đổi bề rộng menu là phải
           sửa hai nơi và dễ lệch. Flex tự chia phần còn lại.
           ============================================================ */
        .sv-shell {
            display: flex;
            min-height: 100vh;
        }
        @supports (height: 100dvh) {
            .sv-shell { min-height: 100dvh; }
        }

        /* ===================== Menu trái ===================== */
        .sv-sidebar {
            background: #0b3d91;
            color: #fff;
        }

        /* Từ lg trở lên: menu đứng cố định bên trái, tự cuộn khi dài */
        @media (min-width: 992px) {
            .sv-sidebar.offcanvas-lg {
                position: sticky;
                top: 0;
                height: 100vh;
                width: var(--sv-sidebar-width);
                flex: 0 0 var(--sv-sidebar-width);
                overflow-y: auto;
                background-color: #0b3d91 !important;
            }
        }

        /* Dưới lg: Bootstrap biến nó thành ngăn kéo trượt ra từ trái */
        .sv-sidebar.offcanvas-lg {
            --bs-offcanvas-width: 270px;
            background-color: #0b3d91;
        }

        .sv-sidebar .brand {
            padding: 18px 20px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, .15);
        }

        .sv-sidebar .nav-link {
            color: rgba(255, 255, 255, .8);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sv-sidebar .nav-link i { width: 22px; flex: 0 0 22px; }
        .sv-sidebar .nav-link:hover { background: rgba(255, 255, 255, .08); color: #fff; }
        .sv-sidebar .nav-link.active { background: rgba(255, 255, 255, .18); color: #fff; font-weight: 600; }

        .sv-sidebar .nav-divider {
            margin: 10px 20px;
            border-top: 1px solid rgba(255, 255, 255, .15);
        }

        /* Nút đóng của ngăn kéo, chỉ hiện dưới lg */
        .sv-sidebar .offcanvas-header { border-bottom: 1px solid rgba(255,255,255,.15); }

        /* ===================== Cột nội dung ===================== */
        .sv-main {
            flex: 1 1 auto;
            min-width: 0;          /* cho phép con co lại, nếu không bảng dài sẽ đẩy tràn */
            display: flex;
            flex-direction: column;
        }

        .sv-topbar {
            background: #fff;
            padding: 10px clamp(12px, 3vw, 24px);
            border-bottom: 1px solid #e3e6ea;
            position: sticky;
            top: 0;
            z-index: 1020;
            gap: 10px;
        }

        .sv-topbar h5 {
            font-size: clamp(1rem, 2.6vw, 1.25rem);
            margin: 0;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sv-avatar {
            width: 34px; height: 34px;
            object-fit: cover; border-radius: 50%;
            flex: 0 0 34px;
        }

        .sv-noidung { padding: clamp(12px, 3vw, 24px); }

        /* Vùng chạm đủ lớn trên thiết bị cảm ứng */
        @media (max-width: 991.98px) {
            .btn, .sv-sidebar .nav-link { min-height: 44px; }
        }

        /* Dưới 576px: ẩn bớt chữ ở thanh trên cùng cho đỡ chật */
        @media (max-width: 575.98px) {
            .sv-topbar .sv-ten-nguoi-dung { display: none; }
            .sv-topbar .btn span { display: none; }
        }
    </style>
</head>
<body>

<div class="sv-shell">

    <!-- ===================== Menu trái ===================== -->
    <aside class="sv-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="svSidebar"
           aria-labelledby="svSidebarLabel">

        <div class="offcanvas-header d-lg-none">
            <h5 class="offcanvas-title text-white mb-0" id="svSidebarLabel">
                <i class="fas fa-graduation-cap me-2"></i>Cổng sinh viên
            </h5>
            <button type="button" class="btn-close btn-close-white"
                    data-bs-dismiss="offcanvas" data-bs-target="#svSidebar" aria-label="Đóng"></button>
        </div>

        <div class="brand d-none d-lg-block">
            <i class="fas fa-graduation-cap me-2"></i>Cổng sinh viên
        </div>

        <nav class="nav flex-column mt-lg-2">
            <a class="nav-link" th:href="@{/sinhvien/hoso}"
               th:classappend="${menu == 'hoso'} ? 'active'">
                <i class="fas fa-id-card"></i> Hồ sơ cá nhân
            </a>
            <a class="nav-link" th:href="@{/sinhvien/ketqua}"
               th:classappend="${menu == 'ketqua'} ? 'active'">
                <i class="fas fa-chart-line"></i> Kết quả học tập
            </a>
            <a class="nav-link" th:href="@{/sinhvien/chuongtrinh}"
               th:classappend="${menu == 'chuongtrinh'} ? 'active'">
                <i class="fas fa-book"></i> Chương trình đào tạo
            </a>
            <a class="nav-link" th:href="@{/sinhvien/dangky}"
               th:classappend="${menu == 'dangky'} ? 'active'">
                <i class="fas fa-pen-to-square"></i> Đăng ký học phần
            </a>
            <a class="nav-link" th:href="@{/sinhvien/lichhoc}"
               th:classappend="${menu == 'lichhoc'} ? 'active'">
                <i class="fas fa-calendar-days"></i> Lịch học
            </a>
            <a class="nav-link" th:href="@{/sinhvien/hocphi}"
               th:classappend="${menu == 'hocphi'} ? 'active'">
                <i class="fas fa-money-bill-wave"></i> Học phí
            </a>
            <a class="nav-link" th:href="@{/sinhvien/totnghiep}"
               th:classappend="${menu == 'totnghiep'} ? 'active'">
                <i class="fas fa-graduation-cap"></i> Xét tốt nghiệp
            </a>
            <a class="nav-link" th:href="@{/sinhvien/renluyen}"
               th:classappend="${menu == 'renluyen'} ? 'active'">
                <i class="fas fa-hands-holding-circle"></i> Công tác xã hội
            </a>
            <a class="nav-link" th:href="@{/sinhvien/thongbao}"
               th:classappend="${menu == 'thongbao'} ? 'active'">
                <i class="fas fa-bell"></i> Thông báo
                <span th:if="${soThongBaoChuaDoc != null and soThongBaoChuaDoc > 0}"
                      class="badge bg-danger rounded-pill ms-1"
                      th:text="${soThongBaoChuaDoc}"></span>
            </a>

            <div class="nav-divider"></div>

            <a class="nav-link" th:href="@{/sinhvien/hoso/matkhau}"
               th:classappend="${menu == 'matkhau'} ? 'active'">
                <i class="fas fa-key"></i> Đổi mật khẩu
            </a>
        </nav>
    </aside>

    <!-- ===================== Nội dung ===================== -->
    <div class="sv-main">

        <header class="sv-topbar d-flex justify-content-between align-items-center">

            <div class="d-flex align-items-center gap-2 min-w-0">
                <!-- Nút mở menu, chỉ hiện dưới lg -->
                <button class="btn btn-outline-secondary btn-sm d-lg-none" type="button"
                        data-bs-toggle="offcanvas" data-bs-target="#svSidebar"
                        aria-controls="svSidebar" aria-label="Mở menu">
                    <i class="fas fa-bars"></i>
                </button>

                <h5 layout:fragment="page-title">Cổng sinh viên</h5>
            </div>

            <div class="d-flex align-items-center gap-2 gap-md-3 flex-shrink-0">
                <span th:if="${sinhVien != null}" class="d-flex align-items-center gap-2">
                    <img th:if="${sinhVien.anhDaiDien != null and !sinhVien.anhDaiDien.isEmpty()}"
                         th:src="@{'/uploads/' + ${sinhVien.anhDaiDien}}"
                         class="sv-avatar" alt="">
                    <i th:unless="${sinhVien.anhDaiDien != null and !sinhVien.anhDaiDien.isEmpty()}"
                       class="fas fa-user-circle fa-lg text-secondary"></i>
                    <span class="sv-ten-nguoi-dung">
                        <strong th:text="${sinhVien.hoTen}"></strong>
                        <small class="text-muted" th:text="'(' + ${sinhVien.maSoSinhVien} + ')'"></small>
                    </span>
                </span>

                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        <i class="fas fa-right-from-bracket"></i>
                        <span class="ms-1">Đăng xuất</span>
                    </button>
                </form>
            </div>
        </header>

        <main class="sv-noidung">
            <div layout:fragment="content"></div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/bang.js}"></script>

<script>
    /* Tự bọc mọi bảng vào .table-responsive.
       Bảng điểm có 8 cột, trên điện thoại rộng 360px chắc chắn tràn.
       Bọc lại thì bảng cuộn ngang trong khung của nó, trang vẫn đứng yên. */
    document.querySelectorAll('table').forEach(function (bang) {
        if (!bang.closest('.table-responsive')) {
            var khung = document.createElement('div');
            khung.className = 'table-responsive';
            bang.parentNode.insertBefore(khung, bang);
            khung.appendChild(bang);
        }
    });
</script>

<th:block layout:fragment="scripts"></th:block>

</body>
</html>
