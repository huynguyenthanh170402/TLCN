<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{sinhvien/layout}">
<head>
    <title>Chi tiết thông báo</title>
</head>
<body>

<h5 layout:fragment="page-title">Chi tiết thông báo</h5>

<div layout:fragment="content">

    <a th:href="@{/sinhvien/thongbao}" class="btn btn-sm btn-outline-secondary mb-3">
        <i class="fas fa-arrow-left"></i> Quay lại danh sách
    </a>

    <div class="card shadow-sm">
        <div class="card-body">
            <span class="badge mb-2" th:classappend="${tb.mauLoai}" th:text="${tb.tenLoai}"></span>
            <h4 th:text="${tb.tieuDe}"></h4>
            <div class="text-muted small mb-3">
                <i class="fas fa-building"></i> <span th:text="${tb.noiPhatHanh}"></span>
                &nbsp;·&nbsp;
                <i class="far fa-clock"></i>
                <span th:text="${#temporals.format(tb.ngayDang, 'dd/MM/yyyy HH:mm')}"></span>
                <th:block th:if="${tb.ngayHetHan != null}">
                    &nbsp;·&nbsp; Hết hạn:
                    <span th:text="${#temporals.format(tb.ngayHetHan, 'dd/MM/yyyy')}"></span>
                </th:block>
            </div>
            <hr>
            <!-- th:text tự thoát ký tự HTML; pre-line giữ xuống dòng -->
            <div style="white-space: pre-line; line-height: 1.7;" th:text="${tb.noiDung}"></div>

            <div th:if="${tb.tepDinhKem != null}" class="mt-3">
                <i class="fas fa-paperclip"></i>
                <a th:href="@{'/uploads/' + ${tb.tepDinhKem}}" th:text="${tb.tepDinhKem}"></a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
