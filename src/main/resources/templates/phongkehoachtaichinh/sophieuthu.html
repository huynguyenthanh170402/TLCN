<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{phongkehoachtaichinh/layout}">
<head>
    <title>Sổ phiếu thu</title>
    <style>
        td.tien, th.tien { text-align: right; white-space: nowrap; }
    </style>
</head>
<body>

<h5 layout:fragment="page-title">Sổ phiếu thu</h5>

<div layout:fragment="content">

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Số phiếu</th>
                    <th>Ngày thu</th>
                    <th>MSSV</th>
                    <th>Họ tên</th>
                    <th>Học kỳ</th>
                    <th class="tien">Số tiền</th>
                    <th>Hình thức</th>
                    <th>Người thu</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${ds.empty}">
                    <td colspan="9" class="text-center text-muted py-4">Chưa lập phiếu thu nào.</td>
                </tr>
                <tr th:each="pt : ${ds.content}" th:classappend="${pt.daHuy} ? 'text-muted' : ''">
                    <td class="small fw-semibold">
                        <span th:text="${pt.soPhieu}"></span>
                        <span th:if="${pt.daHuy}" class="badge bg-secondary ms-1">đã hủy</span>
                    </td>
                    <td class="small" th:text="${#temporals.format(pt.ngayThu, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="small" th:text="${pt.congNo.sinhVien.maSoSinhVien}"></td>
                    <td th:text="${pt.congNo.sinhVien.hoTen}"></td>
                    <td class="small" th:text="${pt.congNo.hocKy.maHocKyCode}"></td>
                    <td class="tien fw-semibold"
                        th:text="${#numbers.formatDecimal(pt.soTien, 1, 'POINT', 0, 'COMMA')}"></td>
                    <td class="small" th:text="${pt.tenHinhThuc}"></td>
                    <td class="small" th:text="${pt.nguoiThu}"></td>
                    <td class="text-end">
                        <a th:href="@{/taichinh/phieuthu/{id}(id=${pt.congNo.maCongNoHocPhi})}"
                           class="btn btn-sm btn-outline-secondary">Xem</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" th:if="${ds.totalPages > 1}">
        <ul class="pagination pagination-sm justify-content-center flex-wrap mb-0">
            <li class="page-item" th:classappend="${ds.first} ? 'disabled'">
                <a class="page-link" th:href="@{/taichinh/phieuthu(trang=${ds.number - 1})}">Trước</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="'Trang ' + (${ds.number} + 1) + ' / ' + ${ds.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${ds.last} ? 'disabled'">
                <a class="page-link" th:href="@{/taichinh/phieuthu(trang=${ds.number + 1})}">Sau</a>
            </li>
        </ul>
    </nav>

</div>
</body>
</html>
