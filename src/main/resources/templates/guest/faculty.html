<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="#{faculty.title}">Khoa</title>
    <style>
        .the-khoa {
            display: block; height: 100%;
            text-decoration: none; color: inherit;
            border: 1px solid #dee2e6; border-radius: .7rem;
            padding: 1.4rem 1.5rem; background: #fff;
            border-top: 4px solid #0b3d91;
            transition: box-shadow .18s, transform .18s;
        }
        .the-khoa:hover {
            box-shadow: 0 .6rem 1.4rem rgba(11, 61, 145, .14);
            transform: translateY(-3px);
            color: inherit;
        }
        .the-khoa .ten { font-weight: 700; font-size: 1.05rem; line-height: 1.35; }
        .the-khoa .so  { font-size: 2rem; font-weight: 700; color: #0b3d91; line-height: 1; }
        .the-khoa .nhan { font-size: .82rem; color: #6c757d; }
    </style>
</head>
<body>
<main layout:fragment="content">

    <section class="hero">
        <div class="container">
            <h1 th:text="#{faculty.list.heading}">Các khoa đào tạo</h1>
            <p th:text="#{faculty.list.sub}">Bấm vào một khoa để xem các ngành.</p>
        </div>
    </section>

    <section class="py-5">
        <div class="container">

            <div th:if="${dsKhoa.empty}" class="alert alert-secondary"
                 th:text="#{faculty.empty}">Chưa có dữ liệu khoa đào tạo.</div>

            <div class="row g-4">
                <div class="col-md-6 col-lg-4" th:each="k : ${dsKhoa}">
                    <a class="the-khoa" th:href="@{/faculty/{id}(id=${k.maDonVi})}">
                        <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
                            <div class="ten" th:text="${k.ten}">Khoa</div>
                            <i class="fas fa-arrow-right text-primary"></i>
                        </div>

                        <div class="d-flex align-items-end gap-3">
                            <div>
                                <div class="so" th:text="${k.soNganh}">0</div>
                                <div class="nhan" th:text="#{faculty.count.majors}">ngành đào tạo</div>
                            </div>
                            <div class="ms-auto text-end nhan">
                                <div th:text="${k.tongHocPhan} + ' học phần'"></div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </section>

</main>
</body>
</html>
