<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="#{major.title}">Ngành học</title>
    <style>
        .nhom-khoa {
            font-weight: 700; color: #0b3d91;
            padding-bottom: .5rem; margin-bottom: 1rem;
            border-bottom: 2px solid #0b3d91;
        }
        .the-nganh {
            display: block; height: 100%;
            text-decoration: none; color: inherit;
            border: 1px solid #dee2e6; border-radius: .6rem;
            padding: 1.1rem 1.25rem; background: #fff;
            transition: box-shadow .18s, border-color .18s;
        }
        .the-nganh:hover {
            border-color: #0b3d91;
            box-shadow: 0 .4rem 1rem rgba(11, 61, 145, .12);
            color: inherit;
        }
        .the-nganh .ten { font-weight: 600; line-height: 1.35; }
        .the-nganh .nhan { font-size: .82rem; color: #6c757d; }
    </style>
</head>
<body>
<main layout:fragment="content">

    <section class="hero">
        <div class="container">
            <h1 th:text="#{major.list.heading}">Ngành đào tạo</h1>
            <p th:text="#{major.list.sub}">Bấm vào một ngành để xem khung chương trình.</p>
        </div>
    </section>

    <section class="py-5">
        <div class="container">

            <div th:if="${theoKhoa.empty}" class="alert alert-secondary"
                 th:text="#{major.empty}">Chưa có ngành nào được khai báo.</div>

            <!-- Mỗi khoa một cụm, ngành của khoa nằm trong cụm đó -->
            <div class="mb-5" th:each="nhom : ${theoKhoa}">
                <h5 class="nhom-khoa" th:text="${nhom.key}">Khoa</h5>

                <div class="row g-3">
                    <div class="col-md-6 col-lg-4" th:each="n : ${nhom.value}">
                        <a class="the-nganh" th:href="@{/major/{id}(id=${n.maNganh})}">
                            <div class="ten mb-2" th:text="${n.tenNganh}">Ngành</div>
                            <div class="nhan">
                                <span th:if="${n.coChuongTrinh}"
                                      th:text="${n.soHocPhan} + ' học phần · '
                                               + ${n.tongTinChi} + ' tín chỉ'"></span>
                                <span th:unless="${n.coChuongTrinh}" class="text-muted"
                                      th:text="#{major.detail.noprogram}"></span>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

</main>
</body>
</html>
