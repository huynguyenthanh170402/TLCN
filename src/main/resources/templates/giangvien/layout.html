<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title layout:title-pattern="$CONTENT_TITLE | Cổng giảng viên">Cổng giảng viên</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/bang.css}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        :root { --gv-sidebar-width: 250px; }

        body { background: #f4f6f9; overflow-x: hidden; }

        img, svg, video, iframe { max-width: 100%; height: auto; }
        td, th, p, li, h1, h2, h3, h4, h5, h6 {
            overflow-wrap: break-word; word-break: break-word;
        }
        .table-responsive { -webkit-overflow-scrolling: touch; }

        .gv-shell { display: flex; min-height: 100vh; }
        @supports (height: 100dvh) { .gv-shell { min-height: 100dvh; } }

        /* Xanh ngọc cho cổng giảng viên. Năm khu năm màu: sinh viên xanh dương,
           giảng viên xanh ngọc, tài chính xanh lá, công tác sinh viên tím,
           ban giám hiệu đỏ sẫm. */
        .gv-sidebar { background: #0f766e; color: #fff; }

        .gv-sidebar.offcanvas-lg {
            --bs-offcanvas-width: 270px;
            background-color: #0f766e;
            display: flex; flex-direction: column;
        }
        @media (min-width: 992px) {
            .gv-sidebar.offcanvas-lg {
                position: sticky; top: 0; height: 100vh;
                width: var(--gv-sidebar-width);
                flex: 0 0 var(--gv-sidebar-width);
                overflow-y: auto;
                background-color: #0f766e !important;
            }
        }

        .gv-sidebar .brand {
            padding: 16px 20px; font-weight: 700; line-height: 1.3;
            border-bottom: 1px solid rgba(255,255,255,.15);
        }
        .gv-sidebar .brand small { opacity: .75; font-weight: 400; }

        .gv-sidebar .nav-link {
            color: rgba(255,255,255,.8); padding: 11px 20px;
            display: flex; align-items: center; gap: 4px;
        }
        .gv-sidebar .nav-link i { width: 22px; flex: 0 0 22px; }
        .gv-sidebar .nav-link:hover { background: rgba(255,255,255,.08); color: #fff; }
        .gv-sidebar .nav-link.active {
            background: rgba(255,255,255,.18); color: #fff; font-weight: 600;
        }
        .gv-sidebar .nav-nhan {
            padding: 14px 20px 6px; font-size: .72rem; text-transform: uppercase;
            letter-spacing: .6px; opacity: .55;
        }
        .gv-sidebar .offcanvas-header { border-bottom: 1px solid rgba(255,255,255,.15); }

        .gv-chan {
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,.15);
            padding: 12px 20px 16px;
        }
        .gv-chan .ten {
            font-size: .9rem; font-weight: 600; line-height: 1.2;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .gv-chan .vai-tro { font-size: .75rem; opacity: .6; }
        .gv-chan .btn-dangxuat {
            --bs-btn-hover-bg: #b91c1c;
            --bs-btn-hover-border-color: #b91c1c;
        }

        .gv-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

        .gv-topbar {
            background: #fff; padding: 10px clamp(12px, 3vw, 24px);
            border-bottom: 1px solid #e3e6ea;
            position: sticky; top: 0; z-index: 1020; gap: 10px;
        }
        .gv-topbar h5 {
            font-size: clamp(1rem, 2.6vw, 1.25rem); margin: 0; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .gv-noidung { padding: clamp(12px, 3vw, 24px); }

        @media (max-width: 991.98px) {
            .btn, .gv-sidebar .nav-link { min-height: 44px; }
        }
    </style>
</head>
<body>

<div class="gv-shell">

    <!-- ===================== Menu trái ===================== -->
    <aside class="gv-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="gvSidebar">

        <div class="offcanvas-header d-lg-none">
            <h5 class="offcanvas-title text-white mb-0">
                <i class="fas fa-chalkboard-user me-2"></i>Cổng giảng viên
            </h5>
            <button type="button" class="btn-close btn-close-white"
                    data-bs-dismiss="offcanvas" data-bs-target="#gvSidebar" aria-label="Đóng"></button>
        </div>

        <div class="brand d-none d-lg-block">
            <i class="fas fa-chalkboard-user me-2"></i>Cổng giảng viên
        </div>

        <nav class="nav flex-column mt-lg-2">
            <a class="nav-link" th:href="@{/giangvien}"
               th:classappend="${menu == 'tongquan'} ? 'active'">
                <i class="fas fa-gauge-high"></i> Tổng quan
            </a>

            <div class="nav-nhan">Giảng dạy</div>

            <a class="nav-link" th:href="@{/giangvien/lichday}"
               th:classappend="${menu == 'lichday'} ? 'active'">
                <i class="fas fa-calendar-days"></i> Lịch dạy
            </a>
            <a class="nav-link" th:href="@{/giangvien/lop}"
               th:classappend="${menu == 'lop'} ? 'active'">
                <i class="fas fa-book-open"></i> Lớp giảng dạy
            </a>

            <div class="nav-nhan">Tài khoản</div>

            <a class="nav-link" th:href="@{/giangvien/hoso}"
               th:classappend="${menu == 'hoso'} ? 'active'">
                <i class="fas fa-id-badge"></i> Hồ sơ cá nhân
            </a>
            <a class="nav-link" th:href="@{/giangvien/matkhau}"
               th:classappend="${menu == 'matkhau'} ? 'active'">
                <i class="fas fa-key"></i> Đổi mật khẩu
            </a>
        </nav>

        <!-- ============ Khối tài khoản, luôn ở đáy ============ -->
        <div class="gv-chan">
            <div class="d-flex align-items-center gap-2 mb-3">
                <i class="fas fa-user-tie fa-lg"></i>
                <div class="min-w-0">
                    <div class="ten"
                         th:text="${giangVien != null} ? ${giangVien.tenHienThi} : ${#authentication.name}">
                        giảng viên</div>
                    <div class="vai-tro"
                         th:text="${giangVien != null} ? ${giangVien.maSoGiangVien} : 'Giảng viên'">GV</div>
                </div>
            </div>

            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-light btn-dangxuat w-100">
                    <i class="fas fa-right-from-bracket me-1"></i> Đăng xuất
                </button>
            </form>
        </div>
    </aside>

    <!-- ===================== Nội dung ===================== -->
    <div class="gv-main">

        <header class="gv-topbar d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2 min-w-0">
                <button class="btn btn-outline-secondary btn-sm d-lg-none" type="button"
                        data-bs-toggle="offcanvas" data-bs-target="#gvSidebar" aria-label="Mở menu">
                    <i class="fas fa-bars"></i>
                </button>
                <h5 layout:fragment="page-title">Cổng giảng viên</h5>
            </div>
        </header>

        <main class="gv-noidung">

            <div th:if="${thongBao}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${thongBao}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${loi}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${loi}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${giangVien == null}" class="alert alert-warning">
                <i class="fas fa-triangle-exclamation me-1"></i>
                Tài khoản này chưa được gắn với hồ sơ giảng viên nào.
                Liên hệ Phòng Đào tạo để được gán hồ sơ.
            </div>

            <div layout:fragment="content"></div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/bang.js}"></script>

<script>
    // Bảng nhiều cột sẽ tràn trên điện thoại, bọc lại cho cuộn ngang riêng
    document.querySelectorAll('table').forEach(function (bang) {
        if (!bang.closest('.table-responsive')) {
            var khung = document.createElement('div');
            khung.className = 'table-responsive';
            bang.parentNode.insertBefore(khung, bang);
            khung.appendChild(bang);
        }
    });
</script>

<th:block layout:fragment="scripts"></th:block>

</body>
</html>
