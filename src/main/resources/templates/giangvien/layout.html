<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE | Cổng giảng viên">Cổng giảng viên</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        body { background: #f4f6f9; }
        .gv-sidebar {
            width: 250px; min-height: 100vh;
            background: #0f766e; color: #fff;
            position: fixed; top: 0; left: 0;
        }
        .gv-sidebar .brand {
            padding: 18px 20px; font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,.15);
        }
        .gv-sidebar .nav-link { color: rgba(255,255,255,.8); padding: 12px 20px; }
        .gv-sidebar .nav-link i { width: 22px; }
        .gv-sidebar .nav-link:hover { background: rgba(255,255,255,.08); color: #fff; }
        .gv-sidebar .nav-link.active { background: rgba(255,255,255,.2); color: #fff; font-weight: 600; }
        .gv-main { margin-left: 250px; }
        .gv-topbar { background: #fff; padding: 12px 24px; border-bottom: 1px solid #e3e6ea; }
        @media (max-width: 768px) {
            .gv-sidebar { position: static; width: 100%; min-height: auto; }
            .gv-main { margin-left: 0; }
        }
    </style>
</head>
<body>

<aside class="gv-sidebar">
    <div class="brand">
        <i class="fas fa-chalkboard-user me-2"></i>Cổng giảng viên
    </div>
    <nav class="nav flex-column mt-2">
        <a class="nav-link" th:href="@{/giangvien/lop}"
           th:classappend="${menu == 'lop'} ? 'active'">
            <i class="fas fa-book-open"></i> Lớp giảng dạy
        </a>
    </nav>
</aside>

<div class="gv-main">
    <header class="gv-topbar d-flex justify-content-between align-items-center">
        <h5 class="mb-0" layout:fragment="page-title">Cổng giảng viên</h5>

        <div class="d-flex align-items-center gap-3">
            <span th:if="${giangVien != null}">
                <i class="fas fa-user-tie me-1"></i>
                <strong th:text="${giangVien.tenHienThi}"></strong>
                <small class="text-muted" th:text="'(' + ${giangVien.maSoGiangVien} + ')'"></small>
            </span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-danger">
                    <i class="fas fa-right-from-bracket"></i> Đăng xuất
                </button>
            </form>
        </div>
    </header>

    <main class="p-4">
        <div th:if="${thongBao}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${thongBao}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${loi}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${loi}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${giangVien == null}" class="alert alert-warning">
            Tài khoản này chưa được gắn với hồ sơ giảng viên nào.
        </div>

        <div layout:fragment="content"></div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
