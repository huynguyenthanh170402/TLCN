<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{phongdaotao/layout}">
<head>
    <title>Bảng điểm lớp</title>
</head>
<body>

<h5 layout:fragment="page-title">Bảng điểm lớp</h5>

<div layout:fragment="content">

    <!-- Quay về đúng khoa của lớp này, không về màn hình chọn khoa:
         chuyên viên thường duyệt liên tiếp nhiều lớp trong cùng một khoa. -->
    <a th:href="@{/quanly/duyetdiem/khoa/{id}(id=${maDonVi})}"
       class="btn btn-sm btn-outline-secondary mb-3">
        <i class="fas fa-arrow-left"></i>
        <span th:text="${tenKhoa}">Danh sách</span>
    </a>

    <!-- Thông tin lớp -->
    <div class="card shadow-sm mb-3">
        <div class="card-body d-flex justify-content-between flex-wrap gap-2">
            <div>
                <h5 class="mb-1" th:text="${lop.hocPhan.tenHocPhan}"></h5>
                <div class="text-muted small">
                    <span th:text="${lop.maLop}"></span> ·
                    <span th:text="${lop.hocPhan.soTinChi} + ' tín chỉ'"></span> ·
                    <span th:text="${lop.hocKy.tenHocKy}"></span>
                </div>
                <div class="small mt-1">
                    <i class="fas fa-chalkboard-user"></i>
                    Giảng viên: <strong th:text="${giangVien}"></strong>
                </div>
            </div>
            <div class="text-end">
                <div class="small text-muted">Tình trạng</div>
                <span class="badge bg-info text-dark fs-6" th:text="${tinhTrang}"></span>
            </div>
        </div>
    </div>

    <!-- Bảng điểm (chỉ xem) -->
    <div class="card shadow-sm mb-3">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr class="text-center">
                    <th>STT</th>
                    <th class="text-start">MSSV</th>
                    <th class="text-start">Họ tên</th>
                    <th>QT</th><th>GK</th><th>CK</th>
                    <th>Tổng kết</th><th>Chữ</th><th>Hệ 4</th><th>Kết quả</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${bang.empty}">
                    <td colspan="10" class="text-center text-muted py-4">Lớp chưa có sinh viên.</td>
                </tr>
                <tr th:each="d, it : ${bang}" class="text-center" th:with="kq=${d.ketQua}">
                    <td th:text="${it.count}"></td>
                    <td class="text-start" th:text="${d.dangKy.sinhVien.maSoSinhVien}"></td>
                    <td class="text-start" th:text="${d.dangKy.sinhVien.hoTen}"></td>
                    <td th:text="${kq?.diemQuaTrinh} ?: '—'"></td>
                    <td th:text="${kq?.diemGiuaKy} ?: '—'"></td>
                    <td th:text="${kq?.diemCuoiKy} ?: '—'"></td>
                    <td class="fw-bold"
                        th:text="${kq?.diemTongKet != null} ? ${#numbers.formatDecimal(kq.diemTongKet, 1, 1)} : '—'"></td>
                    <td th:text="${kq?.diemChu} ?: '—'"></td>
                    <td th:text="${kq?.diemHe4 != null} ? ${#numbers.formatDecimal(kq.diemHe4, 1, 1)} : '—'"></td>
                    <td>
                        <span th:if="${kq?.ketQua == 1}" class="badge bg-success">Đạt</span>
                        <span th:if="${kq?.ketQua == 0}" class="badge bg-danger">Không đạt</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Thao tác theo tình trạng -->
    <div th:if="${tinhTrang == 'Chờ duyệt'}" class="row g-3">
        <div class="col-md-6">
            <form th:action="@{/quanly/duyetdiem/{id}/duyet(id=${lop.maLopHocPhan})}" method="post"
                  class="card card-body border-success"
                  onsubmit="return confirm('Duyệt bảng điểm này?');">
                <div class="mb-2 fw-semibold text-success">Bảng điểm hợp lệ</div>
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-check"></i> Duyệt
                </button>
            </form>
        </div>
        <div class="col-md-6">
            <form th:action="@{/quanly/duyetdiem/{id}/tralai(id=${lop.maLopHocPhan})}" method="post"
                  class="card card-body border-danger">
                <label class="mb-2 fw-semibold text-danger">Trả lại cho giảng viên sửa</label>
                <input type="text" name="lyDo" class="form-control mb-2" maxlength="500" required
                       placeholder="Lý do, ví dụ: điểm cuối kỳ SV 22110123 chưa khớp biên bản">
                <button type="submit" class="btn btn-outline-danger">
                    <i class="fas fa-rotate-left"></i> Trả lại
                </button>
            </form>
        </div>
    </div>

    <form th:if="${tinhTrang == 'Đã duyệt'}"
          th:action="@{/quanly/duyetdiem/{id}/congbo(id=${lop.maLopHocPhan})}" method="post"
          class="text-end"
          onsubmit="return confirm('Công bố điểm? Sinh viên sẽ thấy điểm ngay.');">
        <button type="submit" class="btn btn-primary btn-lg">
            <i class="fas fa-bullhorn"></i> Công bố cho sinh viên
        </button>
    </form>

    <div th:if="${tinhTrang == 'Đã công bố'}" class="alert alert-success mb-0">
        Điểm đã công bố. Sinh viên xem được tại mục Kết quả học tập.
    </div>
</div>
</body>
</html>
