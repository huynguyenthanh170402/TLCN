<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{phongdaotao/layout}">
<head>
    <title>Danh sách sinh viên</title>
</head>
<body>

<h5 layout:fragment="page-title">Danh sách sinh viên</h5>

<div layout:fragment="content">

    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/quanly/sinhvien}">Khoa</a></li>
            <li class="breadcrumb-item">
                <a th:href="@{/quanly/sinhvien/khoa/{id}(id=${nganh.donVi.maDonVi})}"
                   th:text="${nganh.donVi.tenDonVi}"></a>
            </li>
            <li class="breadcrumb-item">
                <a th:href="@{/quanly/sinhvien/nganh/{id}(id=${nganh.maNganh})}"
                   th:text="${nganh.tenNganh}"></a>
            </li>
            <li class="breadcrumb-item active" th:text="'Khóa ' + ${khoaTuyenSinh}"></li>
        </ol>
    </nav>

    <div class="card shadow-sm">
        <div class="card-header small text-muted"
             th:text="${trang.totalElements} + ' sinh viên · ' + ${nganh.tenNganh} + ' · khóa ' + ${khoaTuyenSinh}"></div>

        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width:60px">STT</th>
                    <th>MSSV</th>
                    <th>Họ tên</th>
                    <th class="text-center">Giới tính</th>
                    <th class="text-center">Ngày sinh</th>
                    <th>Email</th>
                    <th class="text-center">Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${trang.empty}">
                    <td colspan="8" class="text-center text-muted py-4">Lớp này chưa có sinh viên.</td>
                </tr>
                <tr th:each="sv, it : ${trang.content}">
                    <td class="text-muted" th:text="${trang.number * trang.size + it.count}"></td>
                    <td class="fw-semibold" th:text="${sv.maSoSinhVien}"></td>
                    <td th:text="${sv.hoTen}"></td>
                    <td class="text-center" th:text="${sv.tenGioiTinh}"></td>
                    <td class="text-center small"
                        th:text="${#temporals.format(sv.ngaySinh, 'dd/MM/yyyy')}"></td>
                    <td class="small" th:text="${sv.emailTruong}"></td>
                    <td class="text-center">
                        <span class="badge bg-light text-dark border" th:text="${sv.tenTrangThai}"></span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/quanly/sinhvien/chitiet/{id}(id=${sv.maSinhVien})}"
                           class="btn btn-sm btn-outline-primary">Xem</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Phân trang: mỗi lớp chỉ vài trang nên hiện đủ số -->
        <div class="card-footer d-flex justify-content-between align-items-center"
             th:if="${trang.totalPages > 1}">
            <small class="text-muted"
                   th:text="'Trang ' + ${trang.number + 1} + ' / ' + ${trang.totalPages}"></small>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${trang.first} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/quanly/sinhvien/nganh/{id}/khoa/{khoa}(id=${nganh.maNganh}, khoa=${khoaTuyenSinh}, page=${trang.number - 1})}">&laquo;</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, trang.totalPages - 1)}"
                    th:classappend="${i == trang.number} ? 'active'">
                    <a class="page-link"
                       th:href="@{/quanly/sinhvien/nganh/{id}/khoa/{khoa}(id=${nganh.maNganh}, khoa=${khoaTuyenSinh}, page=${i})}"
                       th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${trang.last} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/quanly/sinhvien/nganh/{id}/khoa/{khoa}(id=${nganh.maNganh}, khoa=${khoaTuyenSinh}, page=${trang.number + 1})}">&raquo;</a>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
