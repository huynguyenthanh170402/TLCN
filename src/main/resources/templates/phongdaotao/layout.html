<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE | Phòng Đào tạo">Phòng Đào tạo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        body { background: #f4f6f9; }
        .ql-sidebar {
            width: 250px; min-height: 100vh;
            background: #1f2937; color: #fff;
            position: fixed; top: 0; left: 0;
        }
        .ql-sidebar .brand {
            padding: 18px 20px; font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,.15);
        }
        .ql-sidebar .nav-link { color: rgba(255,255,255,.8); padding: 12px 20px; }
        .ql-sidebar .nav-link i { width: 22px; }
        .ql-sidebar .nav-link:hover { background: rgba(255,255,255,.08); color: #fff; }
        .ql-sidebar .nav-link.active { background: #b91c1c; color: #fff; font-weight: 600; }
        .ql-sidebar .nav-link.disabled { color: rgba(255,255,255,.35); }
        .ql-main { margin-left: 250px; }
        .ql-topbar { background: #fff; padding: 12px 24px; border-bottom: 1px solid #e3e6ea; }
        @media (max-width: 768px) {
            .ql-sidebar { position: static; width: 100%; min-height: auto; }
            .ql-main { margin-left: 0; }
        }
    </style>
</head>
<body>

<aside class="ql-sidebar">
    <div class="brand">
        <i class="fas fa-building-columns me-2"></i>Phòng Đào tạo
    </div>
    <nav class="nav flex-column mt-2">
        <a class="nav-link" th:href="@{/quanly/hocky}"
           th:classappend="${menu == 'hocky'} ? 'active'">
            <i class="fas fa-calendar-check"></i> Học kỳ &amp; đăng ký
        </a>
        <!-- Các mục sẽ làm ở bước sau -->
        <a class="nav-link disabled" href="#">
            <i class="fas fa-chalkboard"></i> Lớp học phần
        </a>
        <a class="nav-link disabled" href="#">
            <i class="fas fa-bullhorn"></i> Gửi thông báo
        </a>
        <a class="nav-link disabled" href="#">
            <i class="fas fa-user-graduate"></i> Sinh viên
        </a>
    </nav>
</aside>

<div class="ql-main">
    <header class="ql-topbar d-flex justify-content-between align-items-center">
        <h5 class="mb-0" layout:fragment="page-title">Phòng Đào tạo</h5>

        <div class="d-flex align-items-center gap-3">
            <span>
                <i class="fas fa-user-tie me-1"></i>
                <strong th:text="${tenDangNhap}"></strong>
            </span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-danger">
                    <i class="fas fa-right-from-bracket"></i> Đăng xuất
                </button>
            </form>
        </div>
    </header>

    <main class="p-4">
        <div th:if="${thongBao}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${thongBao}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${loi}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${loi}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div layout:fragment="content"></div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
