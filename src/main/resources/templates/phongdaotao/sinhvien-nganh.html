<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{phongdaotao/layout}">
<head>
    <title>Ngành</title>
    <style>
        .the-muc { transition: .15s; text-decoration: none; color: inherit; display: block; height: 100%; }
        .the-muc:hover { transform: translateY(-2px); box-shadow: 0 .4rem .9rem rgba(0,0,0,.12) !important; }
        .the-muc .icon { width: 44px; height: 44px; border-radius: 10px;
                         display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<h5 layout:fragment="page-title">Ngành trong khoa</h5>

<div layout:fragment="content">

    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/quanly/sinhvien}">Khoa</a></li>
            <li class="breadcrumb-item active" th:text="${khoa.tenDonVi}"></li>
        </ol>
    </nav>

    <div class="row g-3">
        <div th:if="${dsNganh.empty}" class="col-12">
            <div class="alert alert-secondary mb-0">Khoa này chưa có sinh viên.</div>
        </div>

        <div class="col-md-6 col-xl-4" th:each="n : ${dsNganh}">
            <a th:href="@{/quanly/sinhvien/nganh/{id}(id=${n.ma})}" class="the-muc card shadow-sm">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="icon bg-info bg-opacity-10 text-info">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <div class="flex-grow-1">
                        <div class="fw-semibold" th:text="${n.ten}"></div>
                        <small class="text-muted" th:text="${n.soLuong} + ' sinh viên'"></small>
                    </div>
                    <i class="fas fa-chevron-right text-muted"></i>
                </div>
            </a>
        </div>
    </div>
</div>
</body>
</html>
