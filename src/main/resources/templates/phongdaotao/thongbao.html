<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{phongdaotao/layout}">
<head>
    <title>Gửi thông báo</title>
</head>
<body>

<h5 layout:fragment="page-title">Thông báo đã gửi</h5>

<div layout:fragment="content">

    <div class="d-flex justify-content-end mb-3">
        <a th:href="@{/quanly/thongbao/soan}" class="btn btn-primary">
            <i class="fas fa-pen"></i> Soạn thông báo
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Tiêu đề</th>
                    <th>Người nhận</th>
                    <th class="text-center">Trạng thái</th>
                    <th class="text-center">Đã đọc</th>
                    <th class="text-center">Ngày đăng</th>
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${trang.empty}">
                    <td colspan="6" class="text-center text-muted py-4">Bạn chưa gửi thông báo nào.</td>
                </tr>
                <tr th:each="tb : ${trang.content}">
                    <td>
                        <span class="badge me-1" th:classappend="${tb.mauLoai}" th:text="${tb.tenLoai}"></span>
                        <span class="fw-semibold" th:text="${tb.tieuDe}"></span>
                        <div class="small text-muted" th:text="${tb.noiPhatHanh}"></div>
                    </td>
                    <td class="small" th:text="${nguoiNhan[tb.maThongBao]}"></td>
                    <td class="text-center">
                        <span th:switch="${tb.trangThai}">
                            <span th:case="0" class="badge bg-secondary">Nháp</span>
                            <span th:case="1" class="badge bg-success">Đang hiển thị</span>
                            <span th:case="2" class="badge bg-dark">Đã gỡ</span>
                        </span>
                        <div th:if="${tb.ngayHetHan != null}" class="small text-muted"
                             th:text="'Hết hạn ' + ${#temporals.format(tb.ngayHetHan, 'dd/MM/yyyy')}"></div>
                    </td>
                    <td class="text-center">
                        <i class="fas fa-eye text-muted"></i>
                        <span th:text="${daDoc[tb.maThongBao]}"></span>
                    </td>
                    <td class="text-center small"
                        th:text="${tb.ngayDang != null} ? ${#temporals.format(tb.ngayDang, 'dd/MM/yyyy HH:mm')} : '—'"></td>
                    <td class="text-center text-nowrap">
                        <form th:if="${tb.trangThai == 0}"
                              th:action="@{/quanly/thongbao/{id}/dang(id=${tb.maThongBao})}"
                              method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-success">
                                <i class="fas fa-paper-plane"></i> Đăng
                            </button>
                        </form>
                        <form th:if="${tb.trangThai == 1}"
                              th:action="@{/quanly/thongbao/{id}/go(id=${tb.maThongBao})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Gỡ thông báo này? Người nhận sẽ không còn thấy nữa.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="fas fa-eye-slash"></i> Gỡ
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer d-flex justify-content-end" th:if="${trang.totalPages > 1}">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${trang.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/quanly/thongbao(page=${trang.number - 1})}">&laquo;</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, trang.totalPages - 1)}"
                    th:classappend="${i == trang.number} ? 'active'">
                    <a class="page-link" th:href="@{/quanly/thongbao(page=${i})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${trang.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/quanly/thongbao(page=${trang.number + 1})}">&raquo;</a>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
