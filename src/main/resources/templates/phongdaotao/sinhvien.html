<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{phongdaotao/layout}">
<head>
    <title>Sinh viên</title>
    <style>
        .the-muc { transition: .15s; text-decoration: none; color: inherit; display: block; height: 100%; }
        .the-muc:hover { transform: translateY(-2px); box-shadow: 0 .4rem .9rem rgba(0,0,0,.12) !important; }
        .the-muc .icon { width: 44px; height: 44px; border-radius: 10px;
                         display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<h5 layout:fragment="page-title">Sinh viên</h5>

<div layout:fragment="content">

    <div th:if="${loi}" class="alert alert-danger" th:text="${loi}"></div>

    <!-- Thanh trên: tìm nhanh + nhập Excel -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <form th:action="@{/quanly/sinhvien/tim}" method="get" class="d-flex gap-2" style="min-width: 320px">
            <input type="text" name="tuKhoa" class="form-control"
                   placeholder="Tìm nhanh theo MSSV hoặc họ tên">
            <button type="submit" class="btn btn-outline-primary text-nowrap">
                <i class="fas fa-magnifying-glass"></i> Tìm
            </button>
        </form>

        <a th:href="@{/quanly/sinhvien/import}" class="btn btn-success">
            <i class="fas fa-file-excel"></i> Nhập từ Excel
        </a>
    </div>

    <!-- Tổng quan -->
    <div class="alert alert-light border d-flex justify-content-between align-items-center">
        <span><i class="fas fa-sitemap text-primary"></i>
              Chọn khoa để xem ngành, rồi tới khóa và danh sách lớp.</span>
        <span class="fw-semibold" th:text="'Toàn trường: ' + ${tongSinhVien} + ' sinh viên'"></span>
    </div>

    <!-- Lưới khoa -->
    <div class="row g-3">
        <div th:if="${dsKhoa.empty}" class="col-12">
            <div class="alert alert-secondary mb-0">Chưa có sinh viên nào trong hệ thống.</div>
        </div>

        <div class="col-md-6 col-xl-4" th:each="k : ${dsKhoa}">
            <a th:href="@{/quanly/sinhvien/khoa/{id}(id=${k.ma})}" class="the-muc card shadow-sm">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="icon bg-primary bg-opacity-10 text-primary">
                        <i class="fas fa-building-columns"></i>
                    </div>
                    <div class="flex-grow-1">
                        <div class="fw-semibold" th:text="${k.ten}"></div>
                        <small class="text-muted" th:text="${k.soLuong} + ' sinh viên'"></small>
                    </div>
                    <i class="fas fa-chevron-right text-muted"></i>
                </div>
            </a>
        </div>
    </div>
</div>
</body>
</html>
