<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <pattern id="pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/>
    </pattern>
  </defs>
  
  <!-- Background Gradient -->
  <rect width="1920" height="1080" fill="url(#grad1)"/>
  
  <!-- Pattern Overlay -->
  <rect width="1920" height="1080" fill="url(#pattern)"/>
  
  <!-- Decorative Circles -->
  <circle cx="10%" cy="20%" r="150" fill="rgba(255,255,255,0.05)"/>
  <circle cx="85%" cy="80%" r="200" fill="rgba(255,255,255,0.05)"/>
  <circle cx="50%" cy="50%" r="100" fill="rgba(255,255,255,0.02)"/>
  
  <!-- Text for context (optional) -->
  <text x="50%" y="45%" font-size="48" font-weight="bold" fill="white" text-anchor="middle" opacity="0.3">
    Trường Học
  </text>
</svg>
