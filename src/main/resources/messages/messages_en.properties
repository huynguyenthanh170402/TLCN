home.info.focus.text=The university teaches applied engineering technology: students follow lectures and then practise in the workshops and laboratories of their own faculty. Alongside its engineering programmes, HCMUTE also trains technical teachers for vocational and technical secondary schools, the tradition behind its Vietnamese name.
home.info.industry.heading=Industry links
home.info.industry.text=Degree programmes reserve time for internships and final projects carried out inside companies. Many specialised courses are designed together with employers, so students meet real equipment and real workflows before they graduate.

