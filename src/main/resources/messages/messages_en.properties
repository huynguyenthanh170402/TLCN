about.title=About
about.heading=About our university
about.subtitle=Learn more about our institution and values
about.mission=Mission
about.mission_content=To train engineers and technologists with strong practical skills and sound professional ethics, meeting the needs of national development and international integration.
about.vision=Vision
about.vision_content=To become a leading application-oriented university in the region, where students gain solid professional knowledge, practical skills and an innovative mindset.
about.history=History
about.history_content=The university has a long tradition in engineering and technical teacher education, and has grown through many stages into one of the most respected higher education institutions in southern Vietnam.
about.history_content2=Over the years the university has steadily expanded its programs, upgraded its facilities and aligned its curricula with international standards, while holding to its core values of quality, integrity and inclusion.
about.values_heading=Our core values
about.value1.title=Quality
about.value1.desc=We measure ourselves by the quality of our teaching and continuously improve our curricula and methods.
about.value2.title=Integrity
about.value2.desc=We uphold academic honesty, transparent administration and fair assessment of every student.
about.value3.title=Inclusion
about.value3.desc=We respect diversity and maintain a friendly, equitable learning environment for all students.
about.why_heading=Why choose us?
about.why1.title=Experienced lecturers
about.why1.desc=Our lecturers hold strong academic credentials, and many bring hands-on industry experience into the classroom.
about.why2.title=Modern facilities
about.why2.desc=Laboratories, workshops and library resources are developed as one coherent system.
about.why3.title=Research opportunities
about.why3.desc=Students can join research projects alongside lecturers from their third year onwards.
about.why4.title=Industry partnerships
about.why4.desc=A wide network of partner companies creates internship and recruitment opportunities for students.
about.why5.title=Career support
about.why5.desc=An annual career fair and career counselling services support students approaching graduation.
about.why6.title=Student services
about.why6.desc=Scholarships, dormitory places and academic advising are available throughout the program.
about.acc_heading=Accreditation and recognition
about.acc1.title=Quality accreditation
about.acc1.desc=Our programs are assessed against national higher education quality standards.
about.acc2.title=National standing
about.acc2.desc=The university is among the well-regarded technical universities in Vietnam.
about.acc3.title=Employer recognition
about.acc3.desc=Employers rate our graduates highly for their practical capability.

# ----- University name and overview -----
about.ten_vi=Ho Chi Minh City University of Technology and Education
about.ten_en=Tr\u01b0\u1eddng \u0110\u1ea1i h\u1ecdc C\u00f4ng ngh\u1ec7 K\u1ef9 thu\u1eadt TP. H\u1ed3 Ch\u00ed Minh
about.viettat=HCM-UTE
about.gioithieu=Ho Chi Minh City University of Technology and Education was formerly Ho Chi Minh City University of Technical Education, and was officially renamed under Decision 2809/QD-TTg dated 26 December 2025 of the Prime Minister. Over more than six decades, it has grown into one of the leading institutions for engineering, technology and technical teacher education in southern Vietnam.

# ----- Key facts -----
about.thongtin_heading=Key facts
about.diachi_nhan=Address
about.diachi=1 Vo Van Ngan Street, Thu Duc City, Ho Chi Minh City
about.hieutruong_nhan=Rector
about.hieutruong=Assoc Prof Dr Le Hieu Giang
about.thanhlap_nhan=Founded
about.thanhlap=5 October 1962
about.website_nhan=Website

# ----- Milestones -----
about.ls1.ngay=5 October 1962
about.ls1.noidung=The Technical Teacher Education Division was founded within the Phu Tho National Technical Centre, the earliest predecessor of the university.
about.ls2.ngay=21 September 1972
about.ls2.noidung=Renamed the Nguyen Truong To Technical Teacher Education College in Thu Duc.
about.ls3.ngay=1974
about.ls3.noidung=Upgraded to Thu Duc University of Education, a member of Thu Duc Polytechnic University.
about.ls4.ngay=27 October 1976
about.ls4.noidung=Thu Duc University of Technical Education was established under Decision 426/TTg.
about.ls5.ngay=1984
about.ls5.noidung=Merged with Thu Duc Technical Secondary School and took the name Ho Chi Minh City University of Technical Education.
about.ls6.ngay=1991
about.ls6.noidung=Technical Teacher Training School V was merged in, widening the scope of programs.
about.ls7.ngay=26 December 2025
about.ls7.noidung=Renamed Ho Chi Minh City University of Technology and Education under Decision 2809/QD-TTg of the Prime Minister.

