# ===================================================================
about.title=Giới thiệu
about.heading=Giới thiệu về Nhà trường
about.subtitle=Tìm hiểu thêm về nhà trường và những giá trị cốt lõi
about.mission=Sứ mạng
about.mission_content=Đào tạo nguồn nhân lực kỹ thuật và công nghệ có năng lực thực hành cao, có phẩm chất đạo đức tốt, đáp ứng yêu cầu phát triển kinh tế xã hội của đất nước và hội nhập quốc tế.
about.vision=Tầm nhìn
about.vision_content=Trở thành trường đại học định hướng ứng dụng hàng đầu khu vực, nơi người học được trang bị đầy đủ kiến thức chuyên môn, kỹ năng nghề nghiệp và tư duy đổi mới sáng tạo.
about.history=Lịch sử hình thành
about.history_content=Nhà trường có bề dày truyền thống trong đào tạo kỹ thuật và sư phạm kỹ thuật, trải qua nhiều giai đoạn phát triển để trở thành một trong những cơ sở giáo dục đại học uy tín của khu vực phía Nam.
about.history_content2=Qua các thời kỳ, nhà trường không ngừng mở rộng quy mô đào tạo, nâng cấp cơ sở vật chất và cập nhật chương trình theo chuẩn quốc tế, trong khi vẫn giữ vững các giá trị cốt lõi về chất lượng, chính trực và hòa nhập.
about.values_heading=Giá trị cốt lõi
about.value1.title=Chất lượng
about.value1.desc=Lấy chất lượng đào tạo làm thước đo, không ngừng cải tiến chương trình và phương pháp giảng dạy.
about.value2.title=Chính trực
about.value2.desc=Trung thực trong học thuật, minh bạch trong quản lý và công bằng trong đánh giá người học.
about.value3.title=Hòa nhập
about.value3.desc=Tôn trọng sự đa dạng, tạo môi trường học tập thân thiện và bình đẳng cho mọi sinh viên.
about.why_heading=Vì sao chọn chúng tôi?
about.why1.title=Đội ngũ giảng viên
about.why1.desc=Giảng viên có trình độ chuyên môn vững, nhiều người có kinh nghiệm thực tế tại doanh nghiệp.
about.why2.title=Cơ sở vật chất hiện đại
about.why2.desc=Hệ thống phòng thí nghiệm, xưởng thực hành và thư viện được đầu tư đồng bộ.
about.why3.title=Cơ hội nghiên cứu
about.why3.desc=Sinh viên được tham gia đề tài nghiên cứu khoa học cùng giảng viên ngay từ năm thứ ba.
about.why4.title=Hợp tác doanh nghiệp
about.why4.desc=Mạng lưới doanh nghiệp đối tác rộng, tạo cơ hội thực tập và tuyển dụng cho sinh viên.
about.why5.title=Hỗ trợ việc làm
about.why5.desc=Ngày hội việc làm thường niên và dịch vụ tư vấn hướng nghiệp cho sinh viên sắp tốt nghiệp.
about.why6.title=Hỗ trợ sinh viên
about.why6.desc=Chính sách học bổng, ký túc xá và hỗ trợ tư vấn học tập trong suốt khóa học.
about.acc_heading=Kiểm định và ghi nhận
about.acc1.title=Kiểm định chất lượng
about.acc1.desc=Các chương trình đào tạo được kiểm định theo bộ tiêu chuẩn chất lượng giáo dục đại học.
about.acc2.title=Xếp hạng trong nước
about.acc2.desc=Nằm trong nhóm các trường đại học kỹ thuật được đánh giá cao tại Việt Nam.
about.acc3.title=Ghi nhận từ doanh nghiệp
about.acc3.desc=Sinh viên tốt nghiệp được doanh nghiệp đánh giá tốt về năng lực thực hành.

